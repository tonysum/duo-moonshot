[project]
name = "duo-moonshot"
version = "0.1.0"
description = "Moonshot backtesting and paper trading system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tony" }]
keywords = ["crypto", "backtest", "futures", "moonshot", "trading"]

dependencies = [
    "psycopg2-binary>=2.9",
    "optuna>=3.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-binance>=1.0.19",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
moonshot = "moonshot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moonshot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
